apiVersion: v1
kind: Pod
metadata:
  name: openclaw-cli
  namespace: openclaw
  labels:
    app: openclaw-cli
spec:
  containers:
  - name: cli
    image: openclaw:latest  # 使用与 gateway 相同的镜像
    imagePullPolicy: IfNotPresent
    command: ["node", "dist/index.js"]
    stdin: true
    tty: true
    env:
    - name: TZ
      valueFrom:
        configMapKeyRef:
          name: openclaw-config
          key: TZ
    - name: HOME
      valueFrom:
        configMapKeyRef:
          name: openclaw-config
          key: HOME
    - name: TERM
      valueFrom:
        configMapKeyRef:
          name: openclaw-config
          key: TERM
    - name: BROWSER
      valueFrom:
        configMapKeyRef:
          name: openclaw-config
          key: BROWSER
    - name: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
      valueFrom:
        configMapKeyRef:
          name: openclaw-config
          key: OPENCLAW_ALLOW_INSECURE_PRIVATE_WS
    - name: OPENCLAW_GATEWAY_TOKEN
      valueFrom:
        secretKeyRef:
          name: openclaw-secrets
          key: OPENCLAW_GATEWAY_TOKEN
    - name: CLAUDE_AI_SESSION_KEY
      valueFrom:
        secretKeyRef:
          name: openclaw-secrets
          key: CLAUDE_AI_SESSION_KEY
          optional: true
    - name: SHENGSUANYUN_API_KEY
      valueFrom:
        secretKeyRef:
          name: openclaw-secrets
          key: SHENGSUANYUN_API_KEY
          optional: true
    - name: CLAUDE_WEB_SESSION_KEY
      valueFrom:
        secretKeyRef:
          name: openclaw-secrets
          key: CLAUDE_WEB_SESSION_KEY
          optional: true
    - name: CLAUDE_WEB_COOKIE
      valueFrom:
        secretKeyRef:
          name: openclaw-secrets
          key: CLAUDE_WEB_COOKIE
          optional: true
    volumeMounts:
    - name: config-volume
      mountPath: /root/.openclaw
    - name: workspace-volume
      mountPath: /root/.openclaw/workspace
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      capabilities:
        drop:
        - NET_RAW
        - NET_ADMIN
  volumes:
  - name: config-volume
    persistentVolumeClaim:
      claimName: openclaw-config-pvc
  - name: workspace-volume
    persistentVolumeClaim:
      claimName: openclaw-workspace-pvc
  restartPolicy: Never
