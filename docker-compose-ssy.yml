services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    container_name: openclaw-gateway
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      SHENGSUANYUN_API_KEY: ${SHENGSUANYUN_API_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg OPENCLAW_INSTALL_DOCKER_CLI=1) or use
      ## docker-setup.sh with OPENCLAW_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      - "sh"
      - "-c"
      - |
        echo "==> Applying elevated tools configuration..."
        node dist/index.js config set auth.profiles '{"shengsuanyun:default":{"provider":"shengsuanyun","mode":"api_key"}}'
        node dist/index.js config set auth.cooldowns.failureWindowHours 0.018  
        node dist/index.js onboard --non-interactive --accept-risk --auth-choice shengsuanyun-api-key --shengsuanyun-api-key "${SHENGSUANYUN_API_KEY}"
        node dist/index.js config set gateway.controlUi.dangerouslyDisableDeviceAuth true
        node dist/index.js config set gateway.controlUi.dangerouslyAllowHostHeaderOriginFallback true
        node dist/index.js config set browser.enabled true
        node dist/index.js config set browser.evaluateEnabled true
        node dist/index.js config set browser.headless true
        node dist/index.js config set browser.noSandbox true
        node dist/index.js config set browser.attachOnly true
        node dist/index.js config set browser.cdpUrl 'ws://${OPENCLAW_BROWSER_CDP_HOST:-localhost}:${OPENCLAW_BROWSER_CDP_PORT:-9222}'
        node dist/index.js config set tools.profile 'full'
        node dist/index.js config set tools.exec.security 'full'
        node dist/index.js config set tools.elevated.enabled true
        node dist/index.js config set tools.elevated.allowFrom.webchat '["*"]'
        node dist/index.js config set tools.elevated.allowFrom.direct '["*"]'
        node dist/index.js config set tools.alsoAllow '["openai_gpt_image_1_5","bytedance_doubao_seedream_5_0_lite","ali_qwen_image_plus","google_gemini_3_1_flash_image_preview","ali_z_image_turbo","ali_wan2_6_i2v","bytedance_doubao_seedream_4_0","openai_sora2","google_gemini_3_pro_image_preview","google_veo3_1_fast_preview","google_veo3_1_preview","bytedance_doubao_seedream_4_5","black_forest_labs_flux_1_1_pro_ultra","openai_gpt_image_1","google_veo3","bytedance_jimeng_i2v_first_v30","bytedance_doubao_seedance_1_0_lite_t2v","ali_wan2_2_animate_mix","ali_wan2_2_t2v_plus","ali_wan2_2_i2v_plus","kling_kling_v2_5_turbo","ali_wan2_5_i2i_preview","bytedance_doubao_seedance_1_0_lite_i2v","ali_wan2_5_t2v_preview","ali_wan2_2_i2v_flash","black_forest_labs_flux_kontext_pro","openai_sora","kling_kling_v2_1","kling_kling_v2_1_master","ali_wan2_5_t2i_preview","ali_wan2_5_i2v_preview","vidu_vidu2_0","black_forest_labs_flux_kontext_dev","black_forest_labs_flux_kontext_max","google_gemini_2_5_flash_image","ali_wan2_2_s2v","ali_wan2_2_kf2v_flash","ali_wan2_2_animate_move","ali_wan_2_2_t2v_fast_lora","ali_wan_2_2_i2v_fast_lora","black_forest_labs_flux_1_1_pro_ultra_finetuned","bytedance_jimeng_v40","black_forest_labs_flux_1_1_pro","black_forest_labs_flux_kontext_dev_lora","black_forest_labs_flux_dev_lora","ali_wan_2_2_t2i_lora","bytedance_jimeng_i2i_v30","bytedance_jimeng_i2v_first_v30_1080","bytedance_jimeng_t2i_v30","bytedance_jimeng_t2i_v31","openai_gpt_image_1_mini","bytedance_doubao_seedream_3_0_t2i","bytedance_doubao_seededit_3_0_i2i","vidu_viduq3_pro","ali_qwen_image_edit_plus","bytedance_jimeng_i2v_first_tail_v30","minimax_s2v_01","minimax_i2v_01_live","kling_kling_v2","bytedance_jimeng_i2v_recamera_v30","minimax_i2v_01_director","bytedance_jimeng_t2v_v30_1080p","bytedance_doubao_seedance_1_0_pro","google_gemini_2_5_flash_image_preview","minimax_t2v_01_director","kling_lipsync","bytedance_jimeng_t2v_v30","bytedance_jimeng_ti2v_v30_pro","kling_kling_v1_6","vidu_vidu1_5","vidu_viduq2_turbo","vidu_viduq1","vidu_viduq1_image","runway_eleven_text_to_sound_v2","runway_eleven_multilingual_v2","bytedance_image_enhance","bytedance_image_upscale","runway_gen4_turbo","runway_gen3a_turbo","openai_whisper","ali_paraformer_v2","runway_gen4_aleph","tencent_hunyuan_3d_pro","tencent_hunyuan_3d_uv","bytedance_doubao_seed3d","tencent_hunyuan_3d_reduce_face","tencent_hunyuan_3d_part","tencent_hunyuan_3d_rapid","tencent_hunyuan_3d_texture"]'
        node dist/index.js config set plugins.entries.shengsuanyun.enabled true
        echo "==> Starting gateway..."
        exec node dist/index.js gateway --bind "${OPENCLAW_GATEWAY_BIND:-lan}" --port 18789
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      SHENGSUANYUN_API_KEY: ${SHENGSUANYUN_API_KEY:-}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway
