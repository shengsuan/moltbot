services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:latest}
    container_name: openclaw-gateway
    dockerfile: Dockerfile.ssy
    environment:
      OPENCLAW_TIMEZONE: ${OPENCLAW_TIMEZONE:-Asia/Shanghai}
      OPENCLAW_HOME: ${OPENCLAW_HOME:-/home/node}
      TERM: xterm-256color
      OPENCLAW_SESSION_WRITE_LOCK_ACQUIRE_TIMEOUT_MS: "120000"
      OPENCLAW_SESSION_WRITE_LOCK_MAX_HOLD_MS: "180000"
      # 网关核心配置
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-lan}
      OPENCLAW_GATEWAY_ORIGIN: ${OPENCLAW_GATEWAY_ORIGIN:-*}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-false}
      # API 密钥
      SHENGSUANYUN_API_KEY: ${SHENGSUANYUN_API_KEY:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      # SSH（可选）
      SSH_ROOT_PASSWORD: ${SSH_ROOT_PASSWORD:-}
      SSH_AUTHORIZED_KEYS: ${SSH_AUTHORIZED_KEYS:-}
    volumes:
      # - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      # - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      # 启用沙盒隔离（agents.defaults.sandbox）需要镜像内有 Docker CLI
      # 构建时加 --build-arg OPENCLAW_INSTALL_DOCKER_CLI=1，或使用 OPENCLAW_SANDBOX=1 自动配置。
      # DOCKER_GID 设为宿主机 docker 组 GID（命令：stat -c '%g' /var/run/docker.sock）。
      - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-10789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-10790}:18790"
      - "${SSH_EXPOSE_PORT:-10722}:22"
    command: >
      sh -c "find /root/.openclaw/agents /home/node/.openclaw/agents
      -name '*.lock' -delete 2>/dev/null || true && openclaw gateway"
    init: true
    restart: unless-stopped
    user: "0:0"  # root：允许 SSH 服务访问宿主密钥
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          curl -sf http://127.0.0.1:18789/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

secrets:
  ssh_key:
    file: ${SSH_AUTHORIZED_KEYS:-~/.ssh/id_ed25519.pub}
